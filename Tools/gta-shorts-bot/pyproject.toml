[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-shorts-bot"
version = "0.1.0"
description = "Local, rights-gated Shorts production for Windows"
requires-python = ">=3.12,<3.14"
dependencies = [
  "requests>=2.32,<3", "python-dotenv>=1.0,<2", "pydantic>=2.10,<3",
  "faster-whisper>=1.1,<2", "piper-tts>=1.3,<2", "Pillow>=11,<13",
  "av>=16,<17",
  "google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2"
]

[project.scripts]
shorts = "shorts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
